server:
  port: 8080

spring:
  application:
    name: fieldops-api

  datasource:
    url: jdbc:postgresql://localhost:5432/fieldops_db
    username: postgres
    password: 200523
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true # ⭐ Libera a execução do import.sql após a criação/atualização das tabelas
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

api:
  security:
    token:
      secret: ${JWT_SECRET:fieldops_secret_key_para_desenvolvimento_123456789}

# ⭐ Configurações do Swagger/OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    use-root-path: true
  show-actuator: true
  packages-to-scan: br.com.fieldops.api.presentation.controller
  paths-to-match: /api/**