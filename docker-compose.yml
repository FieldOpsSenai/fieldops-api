services:
  postgres:
    image: postgres:15-alpine
    container_name: fieldops-db
    restart: always
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: admim
      POSTGRES_PASSWORD: admim123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_fieldops.sql:/docker-entrypoint-initdb.d/init_fieldops.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: fieldops-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: