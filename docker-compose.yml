version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fieldops-db
    restart: always
    environment:
      POSTGRES_DB: fieldops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-200523}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fieldops_backup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fieldops-network

  fieldops-api:
    build: .
    container_name: fieldops-api-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fieldops_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-200523}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
    networks:
      - fieldops-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: fieldops-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - fieldops-network

networks:
  fieldops-network:
    driver: bridge

volumes:
  postgres_data: